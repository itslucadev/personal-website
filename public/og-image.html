<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image - Luca Becker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .og-container {
      width: 1200px;
      height: 630px;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle gradient background */
    .og-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(245, 158, 11, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(245, 158, 11, 0.3);
      object-fit: cover;
    }

    h1 {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .name {
      color: #f59e0b;
    }

    .tagline {
      font-size: 24px;
      color: #a1a1aa;
      max-width: 700px;
      line-height: 1.5;
    }

    .availability {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .dot-container {
      position: relative;
      width: 12px;
      height: 12px;
    }

    .dot-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.3);
      filter: blur(4px);
    }

    .dot {
      position: relative;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22c55e;
    }

    .availability-text {
      font-size: 18px;
      color: #71717a;
    }

    .domain {
      position: absolute;
      bottom: 40px;
      font-size: 20px;
      color: #52525b;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="content">
      <img src="avatar.png" alt="Luca Becker" class="avatar">

      <h1>Hey, I'm <span class="name">Luca Becker</span>!</h1>

      <p class="tagline">
        React Native developer from Germany building modern mobile and web apps with a focus on clean design.
      </p>

      <div class="availability">
        <div class="dot-container">
          <div class="dot-glow"></div>
          <div class="dot"></div>
        </div>
        <span class="availability-text">Available for freelance projects</span>
      </div>
    </div>

    <span class="domain">lucabecker.dev</span>
  </div>
</body>
</html>
