<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favicon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
    }

    .favicon {
      width: 512px;
      height: 512px;
      background: #fafafa;
      border-radius: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, monospace;
    }

    .text {
      font-size: 160px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #09090b;
    }

    .slash {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="favicon">
    <span class="text"><span class="slash">//</span><span style="margin-left: 16px;">LB</span></span>
  </div>
</body>
</html>
