<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Favicon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap"
      rel="stylesheet"
    >
    <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
    }

    .favicon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 512px;
      height: 512px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, monospace;
      background: #fafafa;
      border-radius: 96px;
    }

    .text {
      font-size: 160px;
      font-weight: 700;
      color: #09090b;
      letter-spacing: -0.04em;
    }

    .slash {
      color: #f59e0b;
    }
    </style>
  </head>
  <body>
    <div class="favicon">
      <span class="text"
        ><span class="slash">//</span
        ><span style="margin-left: 16px;">LB</span></span
      >
    </div>
  </body>
</html>
